
name: Build Robot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q RobotOffline_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/RobotOfflineAndroid
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Robot-ali-APK
          path: extracted/RobotOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
          
